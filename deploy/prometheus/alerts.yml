groups:
  - name: japora
    rules:
      - alert: ServiceDown
        expr: probe_success == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "{{ $labels.service }} ne répond plus" }
      - alert: BaseDeDonneesDown
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "PostgreSQL ne répond plus" }
      - alert: TropErreurs5xx
        expr: sum(rate(caddy_http_request_duration_seconds_count{code=~"5.."}[5m])) / sum(rate(caddy_http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Plus de 5 % d'erreurs serveur" }
      - alert: SiteLent
        expr: histogram_quantile(0.95, sum by (le) (rate(caddy_http_request_duration_seconds_bucket[5m]))) > 2
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Site lent : 5 % des requêtes prennent plus de {{ $value | humanizeDuration }}" }
      - alert: SauvegardeEnRetard
        expr: time() - wataru_backup_last_success_timestamp_seconds > 25200
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Aucune sauvegarde réussie depuis plus de 7 heures" }
      # « / » : le système. « /srv/japora-data » : Docker et sauvegardes (deploy/host/split-disk.sh).
      # L'e-mail est envoyé par deploy/host/disk-alert.sh, qui tourne hors de Docker.
      - alert: DisquePresquePlein
        expr: node_filesystem_avail_bytes{mountpoint=~"/|/srv/japora-data",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint=~"/|/srv/japora-data",fstype!="rootfs"} < 0.20
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Disque {{ $labels.mountpoint }} : moins de 20 % d'espace libre" }
      - alert: DisquePlein
        expr: node_filesystem_avail_bytes{mountpoint=~"/|/srv/japora-data",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint=~"/|/srv/japora-data",fstype!="rootfs"} < 0.10
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Disque {{ $labels.mountpoint }} : moins de 10 % d'espace libre" }
      - alert: MemoirePresquePleine
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Moins de 10 % de mémoire libre" }
