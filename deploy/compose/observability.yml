# Module supervision. Seul Grafana est visible, derrière Caddy et un mot de passe.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: wataru-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.6.0
    container_name: wataru-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?lancez deploy/mvp.sh init}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:?lancez deploy/mvp.sh init}
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/japora-stand.json
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [edge, monitoring]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    logging: *logging
    depends_on:
      prometheus: { condition: service_healthy }

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: wataru-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - backup_metrics:/textfile:ro
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    logging: *logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: wataru-cadvisor
    restart: unless-stopped
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging: *logging

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: wataru-blackbox
    restart: unless-stopped
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    logging: *logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: wataru-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: postgres:5432/japora?sslmode=disable
      DATA_SOURCE_USER: japora
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?}
    networks: [monitoring]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    logging: *logging
    depends_on:
      postgres: { condition: service_healthy }

networks:
  edge: {}
  internal: { internal: true }
  monitoring: { internal: true }

volumes:
  prometheus_data: {}
  grafana_data: {}
  backup_metrics: {}
