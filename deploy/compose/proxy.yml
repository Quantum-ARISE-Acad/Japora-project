# Module proxy : le SEUL service joignable depuis Internet.
services:
  caddy:
    image: caddy:2.10-alpine
    container_name: wataru-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?lancez deploy/mvp.sh init}
      ACME_EMAIL: ${ACME_EMAIL:?lancez deploy/mvp.sh init}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificats : les perdre ferait redemander à Let's Encrypt
      - caddy_config:/config
      - japora_uploads:/srv/public/uploads:ro
    networks: [edge, monitoring]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9180/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  edge: {}
  internal: { internal: true }
  monitoring: { internal: true }

volumes:
  caddy_data: {}
  caddy_config: {}
  japora_uploads: {}
